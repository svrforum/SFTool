name: XpenologyUsb Release

# 태그를 밀면 Windows 러너에서 빌드해 Release 에 .exe 를 첨부한다.
#
# 저장소가 여러 도구를 담으므로 태그에 도구 이름을 붙인다:
#   git tag xpenologyusb-v0.1.0 && git push origin xpenologyusb-v0.1.0
#
# 개발 환경이 Linux 라 로컬에서는 Windows 산출물을 만들 수 없다.
# 여기가 배포 가능한 바이너리가 만들어지는 유일한 곳이다.

on:
  push:
    tags:
      - 'xpenologyusb-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: XpenologyUsb/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: XpenologyUsb/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: XpenologyUsb

      # 릴리스로 나가는 것이므로 테스트를 통과하지 못하면 여기서 멈춘다.
      - name: Test
        run: cargo test --all-targets
        working-directory: XpenologyUsb/src-tauri

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: XpenologyUsb
          tagName: ${{ github.ref_name }}
          releaseName: Xpenology USB __VERSION__
          releaseBody: |
            Xpenology 부트로더(m-shell / RR)를 USB에 굽는 프로그램입니다.

            ## 내려받기

            **`XpenologyUsb-portable.exe`** — 이 파일 하나만 받으면 됩니다.
            설치가 필요 없고, 실행하면 바로 뜹니다.

            ### 사용법
            1. 받은 `.exe` 를 실행합니다 (관리자 권한 창이 뜨면 허용해 주세요)
            2. USB를 고르고, 로더를 고르고, 확인합니다
            3. 완료되면 그 USB로 부팅한 뒤 **로더 화면에서 시놀로지 모델을 선택**합니다

            ### 주의
            - 선택한 USB의 **모든 데이터가 지워집니다**
            - 쓰기가 끝나면 윈도우가 "디스크를 포맷하세요" 라고 물어볼 수 있습니다.
              정상이며 **취소**를 누르세요
            - 8GB 이상 USB가 필요합니다
            - 서명되지 않은 프로그램이라 SmartScreen 경고가 뜹니다.
              "추가 정보" → "실행"으로 진행하시면 됩니다

            ### 포터블이 실행되지 않는다면

            이 프로그램은 윈도우에 내장된 WebView2를 사용합니다. Windows 11에는
            기본으로 있고 Windows 10에도 대부분 있지만, 업데이트를 오래 막아둔
            기계에는 없을 수 있습니다. 그 경우에만 `-setup.exe` 를 받으세요.
            WebView2를 자동으로 설치해 줍니다.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      # 포터블 단일 실행 파일을 올린다.
      #
      # tauri-action 이 올리는 것은 설치 프로그램뿐이다. 이 도구는 한 번 쓰고
      # 마는 성격이라 설치를 시키는 것이 어울리지 않는다 — Rufus 도 포터블
      # 단일 exe 다. 릴리스 빌드는 프런트엔드를 바이너리에 넣으므로
      # 이 파일 하나로 동작한다.
      - name: Attach portable executable
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src="XpenologyUsb/src-tauri/target/release/xpenologyusb.exe"
          test -f "$src" || { echo "포터블 실행 파일을 찾지 못했다: $src"; ls -la "$(dirname "$src")"; exit 1; }
          cp "$src" "XpenologyUsb-portable.exe"
          gh release upload "$TAG" "XpenologyUsb-portable.exe" --clobber --repo "$GITHUB_REPOSITORY"

      # 파일 해시를 릴리스 노트에 넣는다.
      #
      # 서명되지 않은 프로그램이라 SmartScreen 경고는 어차피 뜬다. 경고를 없애지는
      # 못하지만, 받는 사람이 "이게 CI 에서 빌드된 그 파일이 맞는지" 를 스스로
      # 확인할 수 있게 근거를 남긴다. 빌드 기록 링크까지 함께 넣어서 어느 커밋에서
      # 나왔는지 추적할 수 있다.
      - name: Publish file hashes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          portable="XpenologyUsb-portable.exe"
          setup="$(ls XpenologyUsb/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)"

          sha_portable=$(sha256sum "$portable" | cut -d' ' -f1)
          sha_setup=$(sha256sum "$setup" | cut -d' ' -f1)

          {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            echo ""
            echo "---"
            echo ""
            echo "## 파일 검증"
            echo ""
            echo "서명되지 않은 프로그램이라 실행할 때 SmartScreen 경고가 뜹니다."
            echo "받으신 파일이 여기서 빌드된 것과 같은지 아래 해시로 확인하실 수 있습니다."
            echo "윈도우에서는 \`certutil -hashfile <파일> SHA256\` 으로 확인합니다."
            echo ""
            echo "| 파일 | SHA-256 |"
            echo "| --- | --- |"
            echo "| \`$portable\` | \`$sha_portable\` |"
            echo "| \`$(basename "$setup")\` | \`$sha_setup\` |"
            echo ""
            echo "이 파일들은 GitHub Actions 에서 소스로부터 자동 빌드되었습니다."
            echo "빌드 기록: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
