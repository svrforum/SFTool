name: XpenologyUsb CI

# 이 프로젝트는 Linux 에서 개발되지만 대상은 Windows 다.
# 그래서 CI 가 하는 일이 두 가지로 나뉜다:
#   - Linux: 순수 로직 테스트. 빠르고 대부분의 회귀를 여기서 잡는다.
#   - Windows: 실제 대상 플랫폼에서 컴파일과 테스트가 되는지 확인한다.
#     Win32 인터롭 코드는 여기서만 컴파일된다.
#
# 실제 USB 에 쓰는 동작은 어느 쪽에서도 검증되지 않는다. 러너에 USB 가 없다.
# 그 부분은 실물 장비에서 수동으로 확인해야 한다.

on:
  push:
    branches: [main]
    paths:
      - 'XpenologyUsb/**'
      - '.github/workflows/xpenologyusb-ci.yml'
  pull_request:
    paths:
      - 'XpenologyUsb/**'
      - '.github/workflows/xpenologyusb-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: XpenologyUsb

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: XpenologyUsb/src-tauri

      # Tauri 의 Linux 백엔드가 요구하는 시스템 라이브러리.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
        working-directory: .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: XpenologyUsb/package-lock.json

      - run: npm ci

      # 프런트엔드가 먼저 빌드돼야 Tauri 가 dist 를 찾는다.
      - run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: XpenologyUsb/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: XpenologyUsb/src-tauri

      - name: Test
        run: cargo test --all-targets
        working-directory: XpenologyUsb/src-tauri

  # 가상 디스크에 실제로 쓰는 통합 테스트.
  #
  # 러너에 USB 는 없지만 VHD 는 붙일 수 있고, 붙이면 \\.\PhysicalDriveN 으로
  # 잡힌다. 지금까지 이 프로젝트의 버그는 거의 전부 실행해봐야만 드러났고 —
  # 컴파일도 되고 clippy 도 통과하고 단위 테스트도 초록불이었다 — 사용자가 대신
  # 테스트해 주는 수밖에 없었다. 그 왕복을 여기서 끊는다.
  #
  # 재현되는 것: 핸들 접근 마스크, 잠금 순서, 파티션 삭제, 이미 레이아웃이 있는
  # 장치에 다시 쓰기, 정렬 규칙.
  # 재현되지 않는 것: 버스 타입 판정, 실제 USB 컨트롤러 특성, 안전 제거, 부팅.
  vhd-write:
    name: Write to a virtual disk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: XpenologyUsb/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: XpenologyUsb/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Create and attach virtual disks
        id: vhd
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @()
          $numbers = @()
          foreach ($name in @('target', 'source')) {
            $p = "$env:RUNNER_TEMP\xpenology-$name.vhdx"
            New-VHD -Path $p -SizeBytes 12GB -Dynamic | Out-Null
            $d = Mount-VHD -Path $p -Passthru | Get-Disk
            Initialize-Disk -Number $d.Number -PartitionStyle MBR -Confirm:$false
            Write-Host "$name disk number: $($d.Number)"
            # Guard: never let the test target disk 0.
            if ($d.Number -eq 0) { throw "Got disk 0. Refusing to continue." }
            $paths += $p
            $numbers += $d.Number
          }
          "disk=$($numbers[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source=$($numbers[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=$($paths[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "srcpath=$($paths[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Write to it
        shell: powershell
        env:
          XPENOLOGY_TEST_DISK: ${{ steps.vhd.outputs.disk }}
          XPENOLOGY_TEST_SOURCE: ${{ steps.vhd.outputs.source }}
        working-directory: XpenologyUsb/src-tauri
        run: cargo test --features vhd-tests --test vhd_write -- --test-threads=1 --nocapture

      - name: Detach the virtual disks
        if: always()
        shell: powershell
        run: |
          foreach ($p in @("${{ steps.vhd.outputs.path }}", "${{ steps.vhd.outputs.srcpath }}")) {
            if ($p -and (Test-Path $p)) {
              Dismount-VHD -Path $p -ErrorAction SilentlyContinue
              Remove-Item $p -Force -ErrorAction SilentlyContinue
            }
          }
