name: XpenologyUsb Test Build

# 릴리스를 만들지 않고 시험용 실행 파일만 뽑는다.
#
# 왜 필요한가: 백신 탐지는 실물 Windows 에서만 확인된다. 그런데 확인하겠다고
# 릴리스를 찍으면 잡히는 파일이 하나씩 늘어난다. 백신의 판정은 해시 하나가
# 아니라 비슷한 파일 무리에 걸리므로, 시험할 때마다 릴리스를 내는 것은 상황을
# 악화시킨다. 여기서는 산출물을 아티팩트로만 올린다 — 받아서 시험하고, 통과한
# 것만 태그를 찍어 릴리스한다.
#
# 실행: Actions 탭 → XpenologyUsb Test Build → Run workflow

on:
  workflow_dispatch:
    inputs:
      note:
        description: '무엇을 시험하는 빌드인가 (아티팩트 이름에 붙는다)'
        required: true
        default: 'candidate'

jobs:
  build:
    name: Build a test executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: XpenologyUsb/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: XpenologyUsb/package-lock.json

      - run: npm ci
        working-directory: XpenologyUsb

      - run: npm run build
        working-directory: XpenologyUsb

      - name: Build the release binary
        run: npm run tauri build
        working-directory: XpenologyUsb

      # 릴리스에 붙는 이름 그대로 모아 둔다. 여기서 받은 파일을 그대로
      # 올릴 수 있어야 하므로 이름이 달라지면 안 된다.
      - name: Collect the artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp XpenologyUsb/src-tauri/target/release/xpenologyusb.exe out/XpenologyUsb-portable.exe
          cp XpenologyUsb/src-tauri/target/release/bundle/nsis/*-setup.exe out/
          echo "--- SHA-256 ---"
          (cd out && sha256sum *)
          echo "커밋: ${GITHUB_SHA}"

      - uses: actions/upload-artifact@v4
        with:
          name: xpenologyusb-${{ inputs.note }}
          path: out/
          retention-days: 14
