[package]
name = "xpenologyusb"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xpenologyusb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 가상 디스크에 실제로 쓰는 통합 테스트를 켠다.
#
# 기본으로 꺼져 있고 CI 의 전용 잡에서만 켠다. 배포 빌드에는 들어가지 않으므로
# 안전 판정을 우회하는 경로가 사용자에게 나가지 않는다.
vhd-tests = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1.9"
zip = "8.6.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "blocking"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Devices_DeviceAndDriverInstallation"] }

